<title>Interview Sessions</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap">
<style>
  /* Layout: one centred column (list, documents, session panel); the live call uses a wider two-panel grid. */
  :root{
    --bg:hsl(0 0% 100%);--fg:hsl(240 5.9% 10%);--muted:hsl(240 3.8% 46.1%);--border:hsl(240 5.9% 90%);
    --card:hsl(60 4.8% 95.9%);--card-border:hsl(240 5.9% 90%);--divider:hsl(240 5.9% 10% / .08);--skel:hsl(240 4.8% 93%);
    --live-bg:hsl(89.4 89.1% 89.2%);--live-fg:hsl(96.2 79.9% 27.3%);--live-stroke:hsl(92.8 79.7% 55.5%);
    --brand:hsl(142.1 76.2% 36.3%);--brand-fg:hsl(0 0% 100%);--hover:hsl(240 5.9% 10% / .04);
    --danger:hsl(0 72.2% 50.6%);--danger-fg:hsl(0 0% 100%);--backdrop:hsl(240 10% 3.9% / .45);--shadow:hsl(240 10% 3.9% / .18);
    --sans:"Inter Tight",ui-sans-serif,system-ui,sans-serif;--mono:ui-monospace,"Cascadia Mono",Menlo,monospace;
    --code-bg:hsl(240 5% 96.5%);--tk-k:hsl(330 70% 42%);--tk-s:hsl(130 50% 30%);--tk-n:hsl(210 75% 40%);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:hsl(240 10% 3.9%);--fg:hsl(240 5.9% 90%);--muted:hsl(240 5% 64.9%);--border:hsl(240 3.7% 15.9%);
    --card:hsl(240 5.9% 10%);--card-border:hsl(240 3.7% 15.9%);--divider:hsl(0 0% 100% / .1);--skel:hsl(240 5.9% 10%);
    --live-bg:hsl(97.8 63.1% 20.2%);--live-fg:hsl(92.1 85.7% 67.1%);--live-stroke:hsl(95 86.7% 32.5%);
    --brand:hsl(142.1 70.6% 45.3%);--brand-fg:hsl(144.9 80.4% 10%);--hover:hsl(0 0% 100% / .05);
    --danger:hsl(0 72.2% 55%);--danger-fg:hsl(0 0% 100%);--backdrop:hsl(0 0% 0% / .6);--shadow:hsl(0 0% 0% / .5);
    --code-bg:hsl(240 8% 7%);--tk-k:hsl(330 80% 72%);--tk-s:hsl(95 55% 68%);--tk-n:hsl(205 85% 70%);color-scheme:dark}}
  :root[data-theme="dark"]{
    --bg:hsl(240 10% 3.9%);--fg:hsl(240 5.9% 90%);--muted:hsl(240 5% 64.9%);--border:hsl(240 3.7% 15.9%);
    --card:hsl(240 5.9% 10%);--card-border:hsl(240 3.7% 15.9%);--divider:hsl(0 0% 100% / .1);--skel:hsl(240 5.9% 10%);
    --live-bg:hsl(97.8 63.1% 20.2%);--live-fg:hsl(92.1 85.7% 67.1%);--live-stroke:hsl(95 86.7% 32.5%);
    --brand:hsl(142.1 70.6% 45.3%);--brand-fg:hsl(144.9 80.4% 10%);--hover:hsl(0 0% 100% / .05);
    --danger:hsl(0 72.2% 55%);--danger-fg:hsl(0 0% 100%);--backdrop:hsl(0 0% 0% / .6);--shadow:hsl(0 0% 0% / .5);
    --code-bg:hsl(240 8% 7%);--tk-k:hsl(330 80% 72%);--tk-s:hsl(95 55% 68%);--tk-n:hsl(205 85% 70%);color-scheme:dark}

  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
  .wrap{max-width:680px;margin:0 auto;padding:24px 16px 120px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:20px 0 0;text-wrap:balance}
  svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .muted{color:var(--muted)} .small{font-size:13px} .error{color:var(--danger)} .tnum{font-variant-numeric:tabular-nums}
  code,kbd{font-family:var(--mono);font-size:.88em;background:var(--hover);border:1px solid var(--border);padding:0 5px;border-radius:6px}

  .banner{display:flex;gap:8px;padding:10px 14px;margin-bottom:16px;border:1px solid var(--border);border-radius:14px;background:var(--card);font-size:13px;color:var(--muted)}
  .banner b{color:var(--fg)}

  .tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:999px;width:fit-content;max-width:100%;box-sizing:border-box;overflow-x:auto;scrollbar-width:none}
  .tab{flex:none;white-space:nowrap;border:0;background:none;color:var(--muted);height:32px;padding:0 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
  .tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--card-border)}
  @media (max-width:440px){.tab{padding:0 10px;font-size:13px}}

  .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}
  .toolbar p{margin:0;flex:1;min-width:220px}
  .search{display:flex;align-items:center;gap:8px;width:380px;max-width:100%;min-width:0;height:40px;box-sizing:border-box;
    border:1px solid var(--border);border-radius:999px;padding:0 4px 0 14px;color:var(--muted)}
  .search:focus-within{border-color:var(--muted)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font:inherit}
  .search input::placeholder{color:var(--muted)}
  .search input::-webkit-search-cancel-button{display:none}
  .search select{border:0;border-left:1px solid var(--border);background:none;color:var(--muted);font:inherit;font-size:13px;padding:0 8px;height:28px;cursor:pointer;border-radius:0}
  .count{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}

  .list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .section{display:flex;flex-direction:column;gap:8px;margin-top:20px}
  .section-head{all:unset;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;display:flex;align-items:center;gap:6px;
    padding:8px 0;background:var(--bg);cursor:pointer;font-size:13px;font-weight:600}
  .section-head:focus-visible{outline:2px solid var(--brand)}
  .section-head .n{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
  .section-head svg{transition:transform .2s}
  .section-head[aria-expanded="false"] svg{transform:rotate(-90deg)}

  /* Card: a full-size button opens the session; the actions button sits above it. */
  .card{position:relative;display:flex;flex-direction:column;gap:12px;padding:15px;border:1px solid var(--card-border);border-radius:24px;background:var(--card)}
  .card:has(.card-hit):hover{background:linear-gradient(var(--hover),var(--hover)),var(--card)}
  .card-hit{position:absolute;inset:0;border:0;border-radius:inherit;background:none;cursor:pointer}
  .card>:not(.card-hit){pointer-events:none}
  .card>.menu-btn{pointer-events:auto}
  .head{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{display:grid;place-items:center;width:40px;height:40px;flex:none;border-radius:12px;background:var(--bg);border:1px solid var(--card-border);font-weight:600}
  .titles{display:flex;flex-direction:column;min-width:0;flex:1;padding-right:40px}
  .titles b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .titles span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-btn{position:absolute;top:15px;right:15px;z-index:1;display:grid;place-items:center;width:32px;height:32px;border-radius:10px;border:0;background:none;color:var(--muted);cursor:pointer}
  .menu-btn:hover,.menu-btn[aria-expanded="true"]{background:var(--hover);color:var(--fg)}
  .notes{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .notes-label{font-size:12px;font-weight:600;color:var(--fg);margin-right:6px}
  .divider{display:block;height:1px;background:var(--divider);margin:0 -9px}
  .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .foot>span{display:flex;align-items:center;gap:6px}
  .foot svg{width:12px;height:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--card-border);background:var(--bg)}
  .pill.live{background:var(--live-bg);color:var(--live-fg);border-color:var(--live-stroke)}
  .pill.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  .skel{height:150px;border-radius:24px;background:var(--skel)}
  @media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.4s ease-in-out infinite}}
  @keyframes pulse{50%{opacity:.55}}

  .state{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:56px 16px}
  .state .icon{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:1px solid var(--border);color:var(--muted);margin-bottom:6px}
  .state .icon svg{width:22px;height:22px}
  .state b{font-weight:600}
  .state p{margin:0;color:var(--muted);max-width:40ch}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--border);
    background:var(--bg);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap}
  .state .btn{margin-top:12px}
  .btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:var(--danger-fg)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn kbd{background:none;border-color:currentColor;opacity:.8}
  .loading-more{color:var(--muted);font-size:13px;text-align:center;min-height:20px;padding-top:12px}

  .menu{position:fixed;z-index:20;min-width:160px;padding:4px;border:1px solid var(--border);border-radius:14px;background:var(--bg);box-shadow:0 10px 30px var(--shadow)}
  .menu button{display:flex;width:100%;border:0;background:none;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
  .menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
  .menu .danger{color:var(--danger)}

  /* Session panel */
  .back{all:unset;cursor:pointer;color:var(--muted);font-size:14px;display:inline-flex;gap:6px;align-items:center}
  .back:hover{color:var(--fg)} .back:focus-visible{outline:2px solid var(--brand)}
  .s-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-top:16px}
  .s-head .titles{padding-right:0}
  .s-head h1{margin:0;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-actions{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
  .pane-tabs{margin-top:20px}
  .pane{margin-top:16px}
  .pane-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-bottom:8px}
  .md{line-height:1.6;overflow-wrap:anywhere}
  .md h3{font-size:15px;margin:18px 0 6px} .md h3:first-child{margin-top:0}
  .md p{margin:6px 0} .md ul{margin:6px 0;padding-left:20px} .md li{margin:3px 0}
  .md pre.code{position:relative;margin:8px 0;padding:12px 14px;border-radius:12px;background:var(--code-bg);border:1px solid var(--card-border);overflow-x:auto;font:13px/1.55 var(--mono)}
  .md pre.code code{background:none;border:0;padding:0;font:inherit}
  .md pre.code .lang{position:absolute;top:6px;right:10px;font:11px var(--sans);color:var(--muted)}
  .tk-k{color:var(--tk-k)} .tk-s{color:var(--tk-s)} .tk-n{color:var(--tk-n)} .tk-c{color:var(--muted);font-style:italic}
  .lines{display:flex;flex-direction:column;gap:10px}
  .line{display:grid;grid-template-columns:92px 1fr;gap:10px;font-size:14px}
  .line .who{color:var(--muted);font-size:12px;font-weight:600;padding-top:2px}
  .line.me .who{color:var(--brand)}
  .line .t{min-width:0;overflow-wrap:anywhere}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:16px;background:var(--card);border:1px solid var(--card-border);overflow-wrap:anywhere}
  .msg.user{align-self:flex-end;background:var(--fg);color:var(--bg);border-color:var(--fg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--border);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
  .chip:hover{background:var(--hover)}
  .inline-form{display:flex;gap:8px;margin-top:14px}
  .text-input{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:0 14px;height:40px}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px}
  .facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}

  /* Live call */
  .live-view{max-width:1100px;margin:0 auto;padding:12px 16px 32px;box-sizing:border-box}
  .live-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border)}
  .live-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
  .live-controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .live-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:16px}
  @media (max-width:760px){.live-grid{grid-template-columns:minmax(0,1fr)}}
  .panel{border:1px solid var(--card-border);background:var(--card);border-radius:20px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 150px);box-sizing:border-box}
  .panel h2{font-size:14px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .panel p{margin:0}
  .panel-scroll{overflow-y:auto;min-height:160px;flex:1}
  .interim{color:var(--muted);font-style:italic;margin:8px 0 0;font-size:14px}
  .answers{display:flex;flex-direction:column;gap:10px}
  .answer{border:1px solid var(--card-border);background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .answer .q{margin:0;color:var(--muted);font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px}
  .seg button{border:0;background:none;padding:4px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:13px}
  .seg button[aria-checked="true"]{background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1px var(--card-border)}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
  .mic{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .mic.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--danger)}
  @media (prefers-reduced-motion:no-preference){.mic.on::before{animation:pulse 1.4s ease-in-out infinite}}

  dialog{width:min(460px,calc(100% - 32px));box-sizing:border-box;padding:20px;border:1px solid var(--border);border-radius:20px;background:var(--bg);color:var(--fg)}
  dialog::backdrop{background:var(--backdrop)}
  .dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  dialog h2{font-size:18px;font-weight:600;margin:0;text-wrap:balance}
  dialog p{margin:8px 0 0;color:var(--muted)}
  .icon-btn{display:grid;place-items:center;width:32px;height:32px;flex:none;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer}
  .icon-btn:hover{background:var(--hover);color:var(--fg)}
  .steps{display:flex;gap:6px;margin-top:16px} .steps span{flex:1;height:4px;border-radius:2px;background:var(--border)} .steps span.done{background:var(--brand)}
  .step-label{font-size:13px}
  .field{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px;font-weight:500}
  .field input,.field select,.field textarea{font:inherit;font-weight:400;font-size:15px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:9px 12px}
  .field textarea{resize:vertical;min-height:96px}
  .field small{font-weight:400;color:var(--muted)}
  .check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;cursor:pointer}
  .check input{margin-top:3px}
  .form-error{color:var(--danger)!important;font-size:13px;min-height:1em}
  .dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px;margin-top:20px}

  /* Floating create button: centred at rest, docks right and shrinks to its icon once you scroll. */
  .fab{position:fixed;z-index:5;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    display:flex;align-items:center;height:48px;padding:0 14px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-fg);
    font-weight:600;cursor:pointer;box-shadow:0 6px 20px var(--shadow)}
  .fab .label{display:grid;grid-template-columns:1fr}
  .fab .label span{overflow:hidden;white-space:nowrap;padding-left:6px}
  .fab.docked{left:calc(100% - 16px);transform:translateX(-100%)}
  .fab.docked .label{grid-template-columns:0fr;opacity:0}
  @media (prefers-reduced-motion:no-preference){
    .fab{transition:left .45s cubic-bezier(.2,.8,.2,1),transform .45s cubic-bezier(.2,.8,.2,1)}
    .fab .label{transition:grid-template-columns .45s cubic-bezier(.2,.8,.2,1),opacity .3s}}
  .toast{position:fixed;z-index:30;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);
    background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13px}
</style>

<div class="wrap" id="wrap">
  <div id="banner" class="banner" role="status" hidden></div>
  <nav class="tabs" role="tablist" aria-label="Sections" id="tabs"></nav>
  <section id="view-list">
    <h1 id="title">Interviews</h1>
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search by role or company" aria-label="Search by role or company" autocomplete="off">
        <select id="sort" aria-label="Sort sessions">
          <option value="status">Status</option><option value="createdAt_desc">Newest</option><option value="createdAt_asc">Oldest</option>
          <option value="title_asc">Title A – Z</option><option value="title_desc">Title Z – A</option>
        </select>
      </label>
      <span id="count" class="count"></span>
    </div>
    <main id="body"></main>
    <div id="sentinel" class="loading-more"></div>
  </section>
  <section id="view-docs" hidden></section>
  <section id="view-session" hidden></section>
</div>
<section id="view-live" class="live-view" hidden></section>
<button id="fab" class="fab" data-create><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="label"><span id="fab-label">Create session</span></span></button>
<div id="menu" class="menu" role="menu" hidden>
  <button role="menuitem" data-act="details">Details</button>
  <button role="menuitem" data-act="edit">Edit</button>
  <button role="menuitem" data-act="delete" class="danger">Delete</button>
</div>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="sessions.js"></script>
<script src="md.js"></script>
<script src="app.js"></script>
